apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet = { prop, fallback ->
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

group = 'expo.modules.naqlawifi'
version = '1.0.0'

android {
  namespace "expo.modules.naqlawifi"
  compileSdk safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 26)
    targetSdk safeExtGet("targetSdkVersion", 35)
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${safeExtGet('kotlinVersion', '1.9.24')}"
}
